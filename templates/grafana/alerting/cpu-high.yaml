apiVersion: 1

groups:
  - orgId: 1
    name: server-tool-cpu
    folder: Server tools
    interval: 1m
    rules:
      - uid: cpu_high
        title: CPU high
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |-
                100 - (avg by (server) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'High CPU on {{ $labels.server }}'
          description: 'CPU usage on {{ $labels.server }} has been above 80% for 5 minutes.'
        labels: {}
        isPaused: false
