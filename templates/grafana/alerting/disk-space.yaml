apiVersion: 1

groups:
  - orgId: 1
    name: server-tool-disk
    folder: Server tools
    interval: 1m
    rules:
      - uid: disk_space_low
        title: Disk space low
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |-
                (
                  (
                    1 - (
                      node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"}
                      / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"}
                    )
                  ) * 100 > 80
                )
                or
                (
                  node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"} < 15 * 1024 * 1024 * 1024
                  and
                  node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"} >= 15 * 1024 * 1024 * 1024
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Low disk space on {{ $labels.server }}:{{ $labels.mountpoint }}'
          description: 'Filesystem {{ $labels.mountpoint }} on {{ $labels.server }} is more than 80% full or has less than 15 GB free.'
        labels: {}
        isPaused: false
