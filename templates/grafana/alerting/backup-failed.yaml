apiVersion: 1

groups:
  - orgId: 1
    name: server-tool-backups
    folder: Server tools
    interval: 1m
    rules:
      - uid: backup_failed
        title: Backup failed
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum by (server, username, application) (count_over_time({logtype="backup", result="failed"}[15m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'Backup failed for {{ $labels.username }}/{{ $labels.application }} on {{ $labels.server }}'
          description: 'The backup of application {{ $labels.application }} for user {{ $labels.username }} on server {{ $labels.server }} failed in the last 15 minutes.'
        labels: {}
        isPaused: false
