# Laravel application: {{APP_NAME}}
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name {{SERVER_NAME}};

    ssl_certificate     {{SSL_CERT}};
    ssl_certificate_key {{SSL_KEY}};

    include {{APP_ROOT}}/nginx/auth.inc;

    root {{APP_ROOT}}/current/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    index index.html index.htm index.php;
    charset utf-8;

    access_log {{APP_ROOT}}/log/access.log;
    error_log {{APP_ROOT}}/log/error.log error;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php{{PHP_VERSION}}-fpm-{{USERNAME}}-{{APP_NAME}}.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name {{SERVER_NAME}};

    location ^~ /.well-known/acme-challenge/ {
        root {{APP_ROOT}}/current/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
