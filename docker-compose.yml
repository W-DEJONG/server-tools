name: server-tools

x-debian-test: &debian-test
  privileged: true
  cgroup: host
  stdin_open: true
  tty: true
  stop_grace_period: 30s
  tmpfs:
    - /run
    - /run/lock
    - /tmp
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - .:/usr/local/lib/server-tools
  working_dir: /usr/local/lib/server-tools
  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: a
    TZ: UTC

services:
  bookworm:
    <<: *debian-test
    hostname: server-tools-bookworm
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        DEBIAN_CODENAME: bookworm
    ports:
      - "8080:80"

  trixie:
    <<: *debian-test
    hostname: server-tools-trixie
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        DEBIAN_CODENAME: trixie
    ports:
      - "8081:80"
